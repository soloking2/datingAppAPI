<header class="p-3 w-full fixed top-0 z-50 bg-linear-to-r from-primary to-black">
  <div class="flex align-middle items-center px-10 mx-auto gap-6">
    <div class="text-white">
      <a
        routerLink="/"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        class="max-h-16 border-r-white border-r-2 pr-6 flex gap-2 items-center align-middle"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6"
        >
          <path
            fill-rule="evenodd"
            d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
            clip-rule="evenodd"
          />
        </svg>
        <h3 class="uppercase text-2xl font-semibold">Dating App</h3>
      </a>
    </div>
    <nav class="flex gap-3 my-2 uppercase text-lg text-white">
      @if (isLoggedIn()) {
        <a
          class="hover:text-orange-400"
          routerLink="/member-list"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: true }"
          >Matches</a
        >
        <a
          class="hover:text-orange-400"
          routerLink="lists"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: true }"
          >Lists</a
        >
        <a
          class="hover:text-orange-400"
          routerLink="messages"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: true }"
          >Messages</a
        >
        <a
          class="hover:text-orange-400"
          routerLink="admin"
          routerLinkActive="text-accent"
          *datingHasRole="['Admin', 'Moderator']"
          [routerLinkActiveOptions]="{ exact: true }"
          >Admin</a
        >
      }
    </nav>
    <div class="flex align-middle ml-auto gap-3">
      <div class="dropdown mr-5 dropdown-end">
        <div
          tabindex="-2"
          role="button"
          class="flex flex-col justify-center align-middle text-white cursor-pointer uppercase text-xs"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 flex self-center"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42"
            />
          </svg>
          <span>{{ selectedtheme() }}</span>
        </div>
        <ul
          tabindex="-1"
          class="dropdown-content menu bg-base-100 rounded-box z-50 w-52 p-2 shadow-sm"
        >
          @for (theme of themes; track $index) {
            <li (click)="handleSelectTheme(theme)">
              <a>{{ theme | titlecase }}</a>
            </li>
          }
        </ul>
      </div>
      @if (isLoggedIn()) {
        <dating-user-profile [user]="user()!" (logOut)="logout($event)" />
      } @else {
        <dating-login (userOutput)="handleUserLoggedIn($event)"
        [loading]="isLoading()"
        />
      }
    </div>
  </div>
</header>
