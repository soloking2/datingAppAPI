<header class="p-3 w-full fixed top-0 z-50 bg-linear-to-r from-primary to-black">
  <div class="flex align-middle items-center px-10 mx-auto gap-6">
    <div class="text-white">
      <a
        routerLink="/"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        class="max-h-16 border-r-white border-r-2 pr-6 flex gap-2 items-center align-middle"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6"
        >
          <path
            fill-rule="evenodd"
            d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
            clip-rule="evenodd"
          />
        </svg>
        <h3 class="uppercase text-2xl font-semibold">Dating App</h3>
      </a>
    </div>
    <nav class="flex gap-3 my-2 uppercase text-lg text-white">
      <a
        class="hover:text-orange-400"
        routerLink="/member-list"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        >Members</a
      >
      <a
        class="hover:text-orange-400"
        routerLink="lists"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        >Lists</a
      >
      <a
        class="hover:text-orange-400"
        routerLink="messages"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        >Messages</a
      >
    </nav>
    <div class="flex align-middle ml-auto gap-3">
      @if (isLoggedIn()) {
        <dating-user-profile [user]="user()!" (logOut)="logout($event)" />
      } @else {
        <dating-login (userOutput)="handleUserLoggedIn($event)" />
      }
    </div>
  </div>
</header>
