<div class="dropdown dropdown-end">
  <div class="flex items-center text-white text-xl gap-3 cursor-pointer" tabindex="0" role="button">
    @if (user()?.imageUrl) {
      <img [src]="user()?.imageUrl" alt="User avatar" class="w-10 h-10 rounded-full"/>
    } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
          clip-rule="evenodd"
        />
      </svg>
    }
    <span class="card-title">{{ user()?.name | titlecase }}</span>
  </div>
  <ul class="dropdown-content dropdown-end menu bg-base-100 rounded-box z-1 w-52" (click)="handleSelectUserItem()">
    <li><a routerLink="/member-list/{{user()?.id}}/profile">Edit Profile</a></li>
    <li><button (click)="logout()">Logout</button></li>
  </ul>
</div>
