<div class="card bg-base-100 mx-auto w-xl flex flex-col rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="onSubmit()">
      <input
        type="email"
        class="input w-full"
        name="email"
        [(ngModel)]="credentials.email"
        placeholder="Email "
      />
      <input
        type="text"
        class="input w-full"
        name="displayName"
        [(ngModel)]="credentials.displayName"
        placeholder="Display Name"
      />
      <input
        type="password"
        class="input w-full"
        name="password"
        placeholder="Password"
        [(ngModel)]="credentials.password"
      />
      <div class="flex items-center justify-end gap-2">
        <button type="reset" class="btn" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isRegistering()">Submit</button>
      </div>
    </form>
  </div>
</div>
