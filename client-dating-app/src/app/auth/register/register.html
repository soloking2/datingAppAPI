<div class="card bg-base-100 mx-auto w-xl flex flex-col rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-primary">Credentials</li>
      <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
    </ul>
    @if (currentStep() === 1) {
      <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full steps">
        <dating-text-input label="Email" type="email" formControlName="email" />
        <dating-text-input [label]="displayName()" type="text" formControlName="displayName" />
        <dating-text-input label="Password" type="password" formControlName="password" />
        <dating-text-input
          label="Password confirm"
          type="password"
          formControlName="confirmPassword"
        />

        <div class="flex items-center justify-end gap-2">
          <button type="reset" class="btn" (click)="cancel()">Cancel</button>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="credentialsForm.invalid"
            (click)="nextStep()"
          >
            Next
          </button>
        </div>
      </form>
    }
    @if (currentStep() === 2) {
      <form
        [formGroup]="profileForm"
        class="flex flex-col gap-4 w-full steps"
        (ngSubmit)="onSubmit()"
      >
        <div>Profile Form</div>
        <div class="flex items-center gap-4">
          <div class="font-semibold">Gender:</div>
          <label class="flex gap-3 items-center">
            <span>Male</span>
            <input
              type="radio"
              formControlName="gender"
              id="male"
              class="radio radio-primary"
              value="male"
            />
          </label>
          <label for="gender" class="flex gap-3 items-center">
            <span>Female</span>
            <input
              type="radio"
              formControlName="gender"
              id="female"
              class="radio radio-primary"
              value="female"
            />
          </label>
        </div>
        <dating-text-input
          label="Date of Birth"
          type="date"
          formControlName="dateOfBirth"
          [maxDate]="maxDate()"
        />
        <dating-text-input label="City" formControlName="city" />
        <dating-text-input label="Country" formControlName="country" />

        <div class="flex items-center justify-end gap-2">
          <button type="button" class="btn" (click)="prevStep()">Prev</button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="profileForm.invalid || isRegistering()"
          >
            @if (isRegistering()) {
              <span class="loading loading-spinner"></span>
            }
            Register
          </button>
        </div>
      </form>
    }
  </div>
  @if (validationErrors().length > 0) {
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
      <ul class="card text-red-500 bg-base-100 text-xs">
        @for (error of validationErrors(); track $index) {
          <li class="list-decimal">{{ error }}</li>
        }
      </ul>
    </div>
  }
</div>
