<dialog #filterModal class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Select filter!</h3>
    <div class="flex-justify-between w-full items-center mt-6">
      <div class="flex flex-col w-full gap-6">
        <label>
          <form class="filter flex justify-between items-center">
            <span class="font-semibold">Select Gender</span>
            <div class="flex gap-3">
              <input type="reset" value="x" class="btn btn-square" />
              <input
                type="radio"
                name="male"
                [(ngModel)]="filterQuery().gender"
                class="btn"
                aria-label="Male"
                value="male"
              />
              <input
                type="radio"
                name="female"
                [(ngModel)]="filterQuery().gender"
                class="btn"
                aria-label="Female"
                value="female"
              />
            </div>
          </form>
        </label>
        <label class="flex justify-between items-center">
          <span class="font-semibold">Select Age</span>
          <div class="flex gap-3">
            <input
              type="number"
              name="minAge"
              [min]="18"
              [(ngModel)]="filterQuery().minAge"
              class="input w-20"
              (change)="onMinAgeChange()"
            />
            <input
              type="number"
              name="maxAge"
              [max]="100"
              [(ngModel)]="filterQuery().maxAge"
              class="input w-20"
              (change)="onMaxAgeChange()"
            />
          </div>
        </label>
        <label class="flex justify-between items-center">
          <span class="font-semibold">Order By</span>
          <select name="orderBy" class="select" [(ngModel)]="filterQuery().orderBy">
          <option selected disabled value="">Order by</option>
          <option value="created">Newest Members</option>
          <option value="lastActive">Last active</option>
          </select>
        </label>
      </div>
    </div>
    <div class="modal-action">
      <button class="btn btn-primary" (click)="submit()">Submit</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button class="btn" (click)="close()">Close</button>
  </form>
</dialog>
