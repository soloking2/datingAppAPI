<div class="flex w-full gap-6 min-h-100">
  <div class="flex items-center gap-4 w-1/2 flex-1">
    <label
      [class]="{'border-purple-600': isDragging(), 'border-4': isDragging(), 'bg-purple-100': isDragging()}"
      for="dropzone-file"
      class="w-full flex flex-col border-2 border-gray-300 h-full border-dashed rounded-lg cursor-pointer items-center justify-center"
    >
      <p class="mb-2 text-lg">Click to upload or drag and drop</p>
      <input type="file" id="dragzone-file" class="hidden" [accept]="fileType()" #filePicker />
    </label>
  </div>
  @if (imageSrc()) {
    <div class="flex flex-col w-1/3 gap-3">
      <div class="flex justify-center border-2 border-gray-300 roundedlg">
        <img
          [src]="imageSrc() || '/user.png'"
          alt="preview"
          class="aspect-square object-cover rounded-lg"
        />
      </div>
      <div class="flex w-full gap-3">
        <button class="btn flex-1" (click)="onCancel()">Cancel</button>
        <button class="btn btn-primary flex-1"
        [disabled]="loading()"
        (click)="uploadImage()"
        >
          @if(loading()) {
            <span class="loading loading-spinner"></span>
          }
          Upload image
        </button>
      </div>
    </div>
  }
</div>
