<div role="tablist" class="tabs tabs-box tabs-lg text-primary w-fit">
  @for (tab of tabs(); track $index) {
    <button
      role="tab"
      class="tab"
      [class.tab-active]="predicate() === tab.value"
      (click)="setPredicate(tab.value)"
    >
      {{ tab.label }}
    </button>
  }
</div>

@if (members().length > 0) {
  <div class="grid grid-cols-5 gap-3 mt-3">
    @for (member of members(); track $index) {
      <dating-member-card [member]="member"
      [likedIds]="likedIds()"
      (likeOutput)="handleLike($event)"

      />
    }
  </div>
}
