<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
    @if(photos().length > 0) {
    @for (photo of photos(); track photo.id) {
      <img [src]="photo.url" alt="for a member" class="w-full rounded-lg">
    }
  }
    @for (photo of mockPhotos; track $index) {
      <img [src]="photo.url" alt="for a member" class="w-full rounded-lg">
    }
  </div>
