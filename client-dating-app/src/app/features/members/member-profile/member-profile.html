@if (member()) {
  <div class="flex flex-col gap-3">
    <div class="flex gap-3">
      <span class="font-semibold">Member since:</span>
      <span>{{ member()?.created | date: 'longDate' }}</span>
    </div>
    <div class="flex gap-3">
      <span class="font-semibold">Last active:</span>
      <span>{{ member()?.lastActive | timeAgo }}</span>
    </div>
    <h3 class="text-lg font-semibold text-primary">About {{ member()?.displayName }}</h3>
    @if (editMode()) {
      <form #editForm="ngForm" class="flex flex-col w-2/4 gap-4" (ngSubmit)="updateEditableMember()">
        <label for="displayName" class="floating-label">
          <span>Display Name</span>
          <input
            type="text"
            class="input w-full"
            name="displayName"
            [(ngModel)]="editableMember.displayName"
            placeholder="Display name "
          />
        </label>
        <label for="description" class="floating-label">
          <span>Description</span>
          <textarea
            id="description"
            class="textarea w-full"
            name="description"
            [(ngModel)]="editableMember.description"
            placeholder="Description "
          >
          </textarea>
        </label>
        <label for="city" class="floating-label">
          <span>City</span>
          <input
            id="city"
            type="text"
            class="input w-full"
            name="city"
            [(ngModel)]="editableMember.city"
            placeholder="City "
          />
        </label>
        <label for="country" class="floating-label">
          <span>Country </span>
          <input
            id="country"
            class="input w-full"
            name="country"
            [(ngModel)]="editableMember.country"
            placeholder="Country name "
          />
        </label>
        <div class="flex justify-end">
          <button class="btn btn-success" type="submit"
          [disabled]="!editForm.dirty"
          >
            Submit
          </button>
        </div>
      </form>
    } @else {
      <div>{{ member()?.description }}</div>
    }
  </div>
}
